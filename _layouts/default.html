<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .site-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem 1.5rem;
        padding-bottom: 0.75rem;
        margin-bottom: 2rem;
        border-bottom: 1px solid #d0d7de;
      }
      .site-title {
        font-size: 1.75rem;
        font-weight: 600;
        color: inherit;
        text-decoration: none;
      }
      .site-title:hover { text-decoration: none; }
      .site-nav a {
        margin-left: 1.25rem;
        color: #57606a;
        text-decoration: none;
        font-weight: 500;
      }
      .site-nav a:first-child { margin-left: 0; }
      .site-nav a:hover { color: #0969da; }
      .site-nav a.active { color: #24292f; border-bottom: 2px solid #0969da; }

      .home {
        display: flex;
        gap: 2.5rem;
        align-items: flex-start;
      }
      .home-photo {
        flex: 0 0 220px;
      }
      .home-photo img {
        width: 100%;
        height: auto;
        border-radius: 8px;
      }
      .home-text {
        flex: 1;
        min-width: 0;
      }
      .home-text h2:first-of-type { margin-top: 1.5rem; }

      @media (max-width: 640px) {
        .home { flex-direction: column; gap: 1.5rem; }
        .home-photo { flex-basis: auto; max-width: 180px; }
      }
    </style>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% include nav.html %}
      </header>

      {{ content }}
    </div>
  </body>
</html>
